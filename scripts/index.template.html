  <!-- Cookie banner LGPD -->
  <div id="muv-cookie" hidden role="dialog" aria-live="polite" aria-label="Aviso de cookies">
    <div class="muv-cookie__text">
      Usamos cookies pra entender o que funciona e melhorar a experiência.
      <a href="/politica-privacidade.html">Saiba mais →</a>
    </div>
    <div class="muv-cookie__actions">
      <button type="button" id="muv-cookie-reject" class="muv-cookie__btn muv-cookie__btn--ghost">Recusar</button>
      <button type="button" id="muv-cookie-accept" class="muv-cookie__btn muv-cookie__btn--primary">Aceitar</button>
    </div>
  </div>

  <!-- Estilos isolados (cookie + WhatsApp) -->
  <style>
    /* WhatsApp button */
    #muv-whatsapp{
      position:fixed; right:20px; bottom:20px; width:56px; height:56px;
      border-radius:50%; background:#25D366; display:flex; align-items:center; justify-content:center;
      box-shadow:0 6px 24px rgba(0,0,0,.28); z-index:9998;
      transition:transform .25s ease, box-shadow .25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #muv-whatsapp:hover{transform:translateY(-2px) scale(1.04); box-shadow:0 12px 32px rgba(0,0,0,.36)}
    #muv-whatsapp svg{display:block}
    .muv-whatsapp__tooltip{
      position:absolute; right:68px; top:50%; transform:translateY(-50%);
      background:#0D0D0D; color:#F5F0EB; padding:8px 12px; border-radius:6px;
      font-family:"Inter",system-ui,sans-serif; font-size:12px; font-weight:500;
      letter-spacing:.01em; white-space:nowrap; opacity:0; pointer-events:none;
      transition:opacity .2s ease;
    }
    #muv-whatsapp:hover .muv-whatsapp__tooltip{opacity:1}
    @media (max-width:600px){ .muv-whatsapp__tooltip{display:none} #muv-whatsapp{right:16px; bottom:16px} }

    /* Cookie banner */
    #muv-cookie{
      position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
      width:min(720px, calc(100vw - 32px));
      background:rgba(13,13,13,.96); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      color:#F5F0EB; padding:18px 22px; border-radius:14px;
      border:1px solid rgba(245,240,235,.08);
      box-shadow:0 18px 48px rgba(0,0,0,.45);
      font-family:"Inter",system-ui,sans-serif;
      display:flex; gap:18px; align-items:center; justify-content:space-between;
      z-index:9999; flex-wrap:wrap;
      animation: muvCookieIn .5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* Bugfix: o display:flex acima sobrepõe o atributo [hidden] do HTML — precisa do !important */
    #muv-cookie[hidden]{ display:none !important; }
    @keyframes muvCookieIn { from{opacity:0; transform:translateX(-50%) translateY(20px)} to{opacity:1; transform:translateX(-50%) translateY(0)} }
    .muv-cookie__text{font-size:13.5px; line-height:1.5; flex:1; min-width:260px}
    .muv-cookie__text a{color:#DE4E2B; font-weight:500; text-decoration:none; border-bottom:1px solid rgba(222,78,43,.4)}
    .muv-cookie__text a:hover{border-bottom-color:#DE4E2B}
    .muv-cookie__actions{display:flex; gap:8px; flex-wrap:wrap}
    .muv-cookie__btn{
      font-family:inherit; font-size:13px; font-weight:500; letter-spacing:.01em;
      padding:10px 18px; border-radius:999px; border:1px solid transparent;
      cursor:pointer; transition:all .25s ease; white-space:nowrap;
    }
    .muv-cookie__btn--primary{background:#F5F0EB; color:#0D0D0D; border-color:#F5F0EB}
    .muv-cookie__btn--primary:hover{background:#DE4E2B; color:#fff; border-color:#DE4E2B}
    .muv-cookie__btn--ghost{background:transparent; color:#F5F0EB; border-color:rgba(245,240,235,.25)}
    .muv-cookie__btn--ghost:hover{background:rgba(245,240,235,.08); border-color:rgba(245,240,235,.45)}
    @media (max-width:520px){ #muv-cookie{padding:16px; flex-direction:column; align-items:stretch; bottom:12px} .muv-cookie__actions{justify-content:flex-end} }
  </style>

  <!-- INLINE_SCRIPTS -->

  <!-- Cookie banner + WhatsApp scroll logic -->
  <script>
    (function(){
      // Cookie banner
      try {
        var consent = localStorage.getItem('muv-cookie-consent');
        if (!consent) {
          var el = document.getElementById('muv-cookie');
          if (el) {
            // Mostra só depois do hero, pra não competir com a entrada cinemática
            setTimeout(function(){ el.hidden = false; }, 4200);
          }
        }
        document.getElementById('muv-cookie-accept').addEventListener('click', function(){
          localStorage.setItem('muv-cookie-consent', 'accepted');
          localStorage.setItem('muv-cookie-consent-at', new Date().toISOString());
          document.getElementById('muv-cookie').hidden = true;
        });
        document.getElementById('muv-cookie-reject').addEventListener('click', function(){
          localStorage.setItem('muv-cookie-consent', 'rejected');
          localStorage.setItem('muv-cookie-consent-at', new Date().toISOString());
          document.getElementById('muv-cookie').hidden = true;
        });
      } catch(_) {}

      // WhatsApp aparece após scroll de 200px
      var wa = document.getElementById('muv-whatsapp');
      function toggleWA(){
        if (!wa) return;
        if (window.scrollY > 200) wa.hidden = false;
        else wa.hidden = true;
      }
      window.addEventListener('scroll', toggleWA, { passive: true });
      toggleWA();
    })();
  </script>
