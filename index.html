/* ============================================================
   GRUPO MUV — Sistema de Estilos
   Base off-white frio + grafite + laranja MUV + azul MUV
   ============================================================ */

:root {
  /* Cores */
  --bg:        #E6E6EF;
  --bg-2:      #DCDCE5;
  --bg-3:      #CFCFD9;
  --ink:       #1A1A1A;
  --ink-2:     #333333;
  --ink-3:     #6B6B73;
  --ink-4:     #9C9CA6;
  --accent:    #DE4E2B;
  --accent-2:  #1B57AD;
  --line:      rgba(26, 26, 26, 0.14);
  --line-2:    rgba(26, 26, 26, 0.08);

  /* Dark sections */
  --dark-bg:   #1B1B1F;
  --dark-bg-2: #232328;
  --dark-ink:  #E6E6EF;
  --dark-ink-2:#A8A8B2;
  --dark-line: rgba(230,230,239,0.14);

  /* Typography */
  --font-display: "Archivo Black", "Anton", system-ui, sans-serif;
  --font-body:    "Inter", "Helvetica Neue", system-ui, sans-serif;
  --font-mono:    "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;

  /* Spacing (responsive via density) */
  --gutter: 7vw;
  --section-y: clamp(96px, 12vw, 200px);
  --block-gap: clamp(48px, 6vw, 96px);

  /* Sizes */
  --h-display: clamp(56px, 10vw, 180px);
  --h-1: clamp(40px, 6vw, 88px);
  --h-2: clamp(30px, 3.8vw, 56px);
  --h-3: clamp(20px, 2vw, 28px);
  --body: clamp(15px, 1.05vw, 17px);
  --small: 13px;
  --micro: 11px;

  /* Easing */
  --ease: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

/* Density */
[data-density="compact"] {
  --gutter: 5vw;
  --section-y: clamp(72px, 8vw, 140px);
  --block-gap: clamp(32px, 4vw, 64px);
  --h-display: clamp(52px, 10vw, 180px);
  --h-1: clamp(40px, 5.5vw, 88px);
  --h-2: clamp(30px, 3.5vw, 56px);
}

[data-density="airy"] {
  --gutter: 9vw;
  --section-y: clamp(120px, 16vw, 260px);
  --block-gap: clamp(64px, 8vw, 128px);
  --h-display: clamp(72px, 14vw, 260px);
}

/* Reset */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  font-size: var(--body);
  line-height: 1.5;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "ss01", "cv11";
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
img { display: block; max-width: 100%; }

/* Typography utilities */
.display {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--h-display);
  line-height: 0.88;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.h1 { font-family: var(--font-body); font-weight: 700; font-size: var(--h-1); line-height: 1.0; letter-spacing: -0.025em; text-wrap: balance; }
.h2 { font-family: var(--font-body); font-weight: 600; font-size: var(--h-2); line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance; }
.h3 { font-family: var(--font-body); font-weight: 600; font-size: var(--h-3); line-height: 1.2; letter-spacing: -0.015em; }

/* Títulos de seção (SectionHead) — Archivo Black mais contido */
.section-head__title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(32px, 4.2vw, 64px);
  line-height: 0.98;
  letter-spacing: -0.03em;
  white-space: pre-line;
  text-wrap: balance;
}
.body-l { font-family: var(--font-body); font-size: 19px; line-height: 1.55; font-weight: 400; }
@media (max-width: 600px) { .body-l { font-size: 17px; } }
.body { font-size: var(--body); line-height: 1.55; }
.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.02em; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.eyebrow-dot::before {
  content: "";
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--accent);
  margin-right: 10px;
  vertical-align: middle;
  transform: translateY(-1px);
}

/* Layout */
.page { padding-top: 96px; min-height: 100vh; }
.page--no-top { padding-top: 0; }
.section { padding: var(--section-y) var(--gutter); }
.section--tight { padding: clamp(48px, 6vw, 96px) var(--gutter); }
.section--dark { background: var(--dark-bg); color: var(--dark-ink); }
.section--dark .eyebrow { color: var(--dark-ink-2); }
.section--ink { background: var(--ink); color: var(--bg); }
.section-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
  gap: 32px;
  align-items: end;
  margin-bottom: var(--block-gap);
}
@media (max-width: 768px) {
  .section-head { grid-template-columns: 1fr; gap: 16px; }
}
.divider { border-top: 1px solid var(--line); }
.divider--dark { border-top: 1px solid var(--dark-line); }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 22px;
  border: 1px solid transparent;
  border-radius: 999px;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.01em;
  transition: all 0.35s var(--ease);
  background: transparent;
  color: inherit;
  white-space: nowrap;
}
.btn--primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn--primary:hover { background: #C9421F; border-color: #C9421F; transform: translateY(-1px); }
.btn--ink {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.btn--ink:hover { background: transparent; color: var(--ink); }
.btn--ghost {
  border-color: var(--line);
  color: var(--ink);
}
.btn--ghost:hover { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.btn--ghost-dark {
  border-color: var(--dark-line);
  color: var(--dark-ink);
}
.btn--ghost-dark:hover { background: var(--dark-ink); color: var(--dark-bg); }
.btn .arrow { display: inline-block; transition: transform 0.35s var(--ease); }
.btn:hover .arrow { transform: translateX(4px); }

.link-arrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
  position: relative;
  padding-bottom: 4px;
}
.link-arrow::after {
  content: "";
  position: absolute;
  bottom: 0; left: 0;
  width: 100%;
  height: 1px;
  background: currentColor;
  transform-origin: right;
  transition: transform 0.4s var(--ease-out);
}
.link-arrow:hover::after { transform-origin: left; transform: scaleX(1.02); }
.link-arrow .arrow { transition: transform 0.35s var(--ease); }
.link-arrow:hover .arrow { transform: translateX(4px); }

/* Pills / tags */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.pill--accent {
  border-color: rgba(222, 78, 43, 0.4);
  background: rgba(222, 78, 43, 0.06);
  color: var(--accent);
}
.pill--blue {
  border-color: rgba(27, 87, 173, 0.4);
  background: rgba(27, 87, 173, 0.06);
  color: var(--accent-2);
}
.pill--dot::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  display: inline-block;
}
.pill--dot.pill--blue::before { background: var(--accent-2); }

/* Cinematic placeholder */
.cine {
  position: relative;
  background:
    repeating-linear-gradient(135deg,
      rgba(26,26,26,0.04) 0 1px,
      transparent 1px 12px),
    linear-gradient(180deg, var(--bg-2), var(--bg-3));
  border: 1px solid var(--line);
  overflow: hidden;
  color: var(--ink-3);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 16px;
}
.cine--dark {
  background:
    repeating-linear-gradient(135deg,
      rgba(230,230,239,0.04) 0 1px,
      transparent 1px 12px),
    linear-gradient(180deg, #232328, #1B1B1F);
  border-color: var(--dark-line);
  color: var(--dark-ink-2);
}
.cine--accent {
  background:
    repeating-linear-gradient(135deg,
      rgba(255,255,255,0.06) 0 1px,
      transparent 1px 12px),
    linear-gradient(180deg, #DE4E2B, #B53B1E);
  color: rgba(255,255,255,0.85);
  border-color: transparent;
}
.cine__label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.cine__corner {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
}
.cine__center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: inherit;
  opacity: 0.7;
}
.cine__play {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 72px; height: 72px;
  border-radius: 50%;
  background: rgba(255,255,255,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  transition: transform 0.4s var(--ease);
}
.cine:hover .cine__play { transform: translate(-50%, -50%) scale(1.08); }

/* Grid utilities */
.grid-12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
@media (max-width: 768px) { .grid-12 { grid-template-columns: 1fr; gap: 16px; } }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 900px) {
  .grid-2 { grid-template-columns: 1fr; }
  .grid-3 { grid-template-columns: 1fr 1fr; }
  .grid-4 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px) {
  .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

/* Nav */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 18px var(--gutter);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(230,230,239,0.7);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  backdrop-filter: blur(20px) saturate(160%);
  border-bottom: 1px solid var(--line-2);
  transition: background 0.35s var(--ease), color 0.35s var(--ease), border-color 0.35s var(--ease);
}
.nav--dark {
  background: rgba(27,27,31,0.7);
  color: var(--dark-ink);
  border-bottom-color: var(--dark-line);
}
.nav__logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.nav__logo-img {
  height: 28px;
  width: auto;
  display: block;
  transition: opacity 0.3s var(--ease);
}
.nav__logo:hover .nav__logo-img { opacity: 0.75; }
/* Legacy mark — mantido caso queiramos voltar pra letter mark */
.nav__logo-mark {
  width: 28px; height: 28px;
  background: var(--ink);
  color: var(--bg);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  letter-spacing: 0.04em;
  border-radius: 6px;
  transition: background 0.3s var(--ease);
}
.nav--dark .nav__logo-mark { background: var(--accent); color: #fff; }
.nav__links {
  display: flex;
  gap: 4px;
  list-style: none;
  padding: 0; margin: 0;
}
.nav__link {
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  color: inherit;
  opacity: 0.7;
  transition: opacity 0.25s var(--ease), background 0.25s var(--ease);
  cursor: pointer;
  background: transparent;
  border: 0;
}
.nav__link:hover { opacity: 1; background: rgba(0,0,0,0.04); }
.nav--dark .nav__link:hover { background: rgba(255,255,255,0.06); }
.nav__link--active { opacity: 1; background: rgba(0,0,0,0.06); }
.nav--dark .nav__link--active { background: rgba(255,255,255,0.08); }
.nav__cta {
  margin-left: 12px;
}

/* Hamburger button (mobile only) */
.nav__burger {
  display: none;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  position: relative;
  z-index: 101;
  color: inherit;
}
.nav__burger-bar {
  display: block;
  position: absolute;
  left: 10px;
  width: 24px;
  height: 2px;
  background: currentColor;
  border-radius: 2px;
  transition: transform 0.35s var(--ease), opacity 0.2s var(--ease), top 0.35s var(--ease), background 0.3s var(--ease);
}
.nav__burger-bar:nth-child(1) { top: 15px; }
.nav__burger-bar:nth-child(2) { top: 21px; }
.nav__burger-bar:nth-child(3) { top: 27px; }
.nav__burger--open { color: #F5F0EB; }
.nav__burger--open .nav__burger-bar:nth-child(1) { top: 21px; transform: rotate(45deg); }
.nav__burger--open .nav__burger-bar:nth-child(2) { opacity: 0; transform: translateX(-8px); }
.nav__burger--open .nav__burger-bar:nth-child(3) { top: 21px; transform: rotate(-45deg); }

@media (max-width: 900px) {
  .nav__links { display: none; }
  .nav__cta { display: none; }
  .nav__burger { display: block; }
}

/* ============================================================
   DRAWER — fullscreen mobile menu (cinematic)
   ============================================================ */
.drawer {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #0D0D0D;
  color: #F5F0EB;
  opacity: 0;
  pointer-events: none;
  visibility: hidden;
  transition: opacity 0.45s var(--ease), visibility 0s linear 0.45s;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.drawer--open {
  opacity: 1;
  pointer-events: auto;
  visibility: visible;
  transition: opacity 0.45s var(--ease), visibility 0s linear 0s;
}

/* Subtle accent wash — Apple/A24 vibe */
.drawer::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(80% 60% at 100% 0%, rgba(27, 87, 173, 0.18), transparent 60%),
    radial-gradient(60% 50% at 0% 100%, rgba(222, 78, 43, 0.12), transparent 60%);
  pointer-events: none;
}

.drawer__inner {
  position: relative;
  min-height: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: clamp(120px, 18vh, 180px) var(--gutter) clamp(40px, 8vh, 64px);
  display: flex;
  flex-direction: column;
  gap: clamp(48px, 8vh, 96px);
}

/* Links list */
.drawer__list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: clamp(6px, 1.4vh, 14px);
}
.drawer__item {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.55s var(--ease-out), transform 0.55s var(--ease-out);
}
.drawer--open .drawer__item {
  opacity: 1;
  transform: translateY(0);
  transition-delay: calc(180ms + var(--i) * 70ms);
}

.drawer__link {
  width: 100%;
  display: flex;
  align-items: baseline;
  gap: clamp(14px, 3vw, 28px);
  padding: clamp(6px, 1vh, 10px) 0;
  background: transparent;
  border: 0;
  color: inherit;
  text-align: left;
  cursor: pointer;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: clamp(40px, 9vw, 56px);
  letter-spacing: -0.025em;
  line-height: 1;
  transition: color 0.25s var(--ease), transform 0.3s var(--ease);
}
.drawer__link:hover,
.drawer__link:focus-visible {
  color: #1B57AD;
  transform: translateX(6px);
  outline: none;
}
.drawer__link--active { color: #DE4E2B; }
.drawer__link-index {
  font-family: var(--font-mono);
  font-size: clamp(11px, 1.4vw, 13px);
  font-weight: 400;
  letter-spacing: 0.16em;
  color: rgba(245, 240, 235, 0.4);
  flex-shrink: 0;
  width: clamp(28px, 4vw, 36px);
  align-self: center;
}

/* Footer block: CTA + socials */
.drawer__footer {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: clamp(28px, 4vh, 40px);
}
.drawer__cta {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 18px 28px;
  background: #F5F0EB;
  color: #0D0D0D;
  border: 0;
  border-radius: 999px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: clamp(15px, 1.6vw, 17px);
  letter-spacing: -0.01em;
  cursor: pointer;
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.55s var(--ease-out), transform 0.55s var(--ease-out), background 0.25s var(--ease), color 0.25s var(--ease);
}
.drawer--open .drawer__cta {
  opacity: 1;
  transform: translateY(0);
  transition-delay: calc(180ms + var(--i) * 70ms);
}
.drawer__cta:hover {
  background: #DE4E2B;
  color: #F5F0EB;
}

.drawer__socials {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  gap: clamp(18px, 3vw, 28px);
  padding-top: clamp(20px, 3vh, 28px);
  border-top: 1px solid rgba(245, 240, 235, 0.12);
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.55s var(--ease-out), transform 0.55s var(--ease-out);
}
.drawer--open .drawer__socials {
  opacity: 1;
  transform: translateY(0);
  transition-delay: calc(180ms + var(--i) * 70ms);
}
.drawer__social {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(245, 240, 235, 0.65);
  transition: color 0.2s var(--ease);
}
.drawer__social:hover,
.drawer__social:focus-visible {
  color: #F5F0EB;
  outline: none;
}

@media (max-width: 380px) {
  .drawer__link { font-size: clamp(34px, 10vw, 44px); }
  .drawer__link-index { display: none; }
}

/* Hide floating UI (cookie banner, WhatsApp) when drawer is active */
body.drawer-active #muv-cookie,
body.drawer-active #muv-whatsapp {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.25s var(--ease), visibility 0s linear 0.25s;
}

@media (prefers-reduced-motion: reduce) {
  .drawer,
  .drawer__item,
  .drawer__cta,
  .drawer__socials,
  .drawer__link { transition-duration: 0.01ms !important; transition-delay: 0ms !important; }
}

/* Footer */
.footer {
  background: var(--dark-bg);
  color: var(--dark-ink);
  padding: var(--section-y) var(--gutter) 32px;
}
.footer__grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 64px;
  margin-bottom: 96px;
}
@media (max-width: 900px) {
  .footer__grid { grid-template-columns: 1fr 1fr; gap: 48px; }
}
@media (max-width: 560px) {
  .footer__grid { grid-template-columns: 1fr; gap: 32px; }
}
.footer__col-title {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--dark-ink-2);
  margin: 0 0 18px;
  font-weight: 500;
}
.footer__col ul {
  list-style: none;
  padding: 0; margin: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.footer__col a {
  color: var(--dark-ink);
  font-size: 14px;
  font-weight: 400;
  transition: color 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.footer__col a:hover { color: var(--accent); }
.footer__bottom {
  border-top: 1px solid var(--dark-line);
  padding-top: 32px;
  display: flex;
  justify-content: space-between;
  align-items: end;
  font-size: 12px;
  color: var(--dark-ink-2);
  gap: 24px;
  flex-wrap: wrap;
}
.footer__giant {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(64px, 18vw, 320px);
  line-height: 0.85;
  letter-spacing: -0.04em;
  color: var(--dark-ink);
  margin: 0 0 32px;
  white-space: nowrap;
  overflow: hidden;
}

/* Hover/reveal patterns */
.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.8s var(--ease-out), transform 0.8s var(--ease-out);
}
.reveal.in {
  opacity: 1;
  transform: translateY(0);
}

/* Service card */
.svc {
  border: 1px solid var(--line);
  padding: 32px;
  border-radius: 4px;
  background: rgba(255,255,255,0.3);
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-height: 320px;
  transition: background 0.35s var(--ease), border-color 0.35s var(--ease);
  cursor: pointer;
}
.svc:hover {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.svc:hover .svc__num, .svc:hover .pill { color: rgba(230,230,239,0.7); border-color: rgba(230,230,239,0.2); }
.svc__num {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--ink-3);
}
.svc__title {
  font-family: var(--font-display);
  font-size: clamp(22px, 2.2vw, 30px);
  line-height: 1.05;
  letter-spacing: -0.01em;
  margin: auto 0 0;
  white-space: pre-line;
}
.svc__desc {
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink-2);
}
.svc:hover .svc__desc { color: rgba(230,230,239,0.85); }

/* Marquee */
.marquee {
  display: flex;
  overflow: hidden;
  gap: 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 24px 0;
  user-select: none;
}
.marquee--dark { border-color: var(--dark-line); }
.marquee__track {
  display: flex;
  gap: 64px;
  animation: marquee 40s linear infinite;
  flex-shrink: 0;
  padding-right: 64px;
}
.marquee__item {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(11px, 1.5vw, 26px);
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--ink-3);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 32px;
}
.marquee__item::after {
  content: "✦";
  color: var(--accent);
  font-size: 0.5em;
}
@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-100%); }
}

/* Case card */
.case {
  display: flex;
  flex-direction: column;
  gap: 8px;
  cursor: pointer;
}
.case__media {
  aspect-ratio: 4 / 3;
  overflow: hidden;
  position: relative;
}
.case__media .cine {
  max-width: none !important;
  width: 100% !important;
}
.case__meta {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 16px;
}
.case__title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(18px, 1.5vw, 24px);
  line-height: 1.15;
  letter-spacing: -0.015em;
  white-space: pre-line;
}
.case__tag {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  white-space: pre-line;
}
.case:hover .case__title { color: var(--accent); }

/* Numbered process step */
.step {
  display: grid;
  grid-template-columns: 56px minmax(0, 1.2fr) minmax(0, 2fr) minmax(0, 1.1fr);
  column-gap: clamp(20px, 3vw, 48px);
  row-gap: 16px;
  padding: clamp(28px, 3.5vw, 44px) 0;
  align-items: baseline;
  border-top: 1px solid var(--line);
  transition: padding-left 0.4s var(--ease);
}
.step:hover { padding-left: 12px; }
.step__num {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--accent);
  padding-top: 4px;
  align-self: start;
}
.step__title {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: clamp(22px, 2.4vw, 34px);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
  align-self: start;
}
.step__desc {
  color: var(--ink-2);
  line-height: 1.55;
  margin: 0;
  font-size: 15px;
  max-width: 50ch;
  align-self: start;
  padding-top: 4px;
}
.step__deliverables {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  line-height: 1.7;
  margin: 0;
  text-align: right;
  align-self: start;
  padding-top: 8px;
  text-transform: uppercase;
}
@media (max-width: 900px) {
  .step {
    grid-template-columns: 48px 1fr;
    grid-template-areas:
      "num    title"
      "num    desc"
      ".      deliverables";
    row-gap: 12px;
    padding: 28px 0;
  }
  .step__num { grid-area: num; padding-top: 8px; }
  .step__title { grid-area: title; }
  .step__desc { grid-area: desc; padding-top: 0; }
  .step__deliverables { grid-area: deliverables; text-align: left; padding-top: 4px; }
}

/* Manifesto */
.manifesto-text {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(24px, 3.4vw, 48px);
  line-height: 1.1;
  letter-spacing: -0.015em;
  text-wrap: balance;
}
.manifesto-text--sm {
  font-size: clamp(16px, 2.3vw, 32px);
  line-height: 1.25;
}
.manifesto-text em {
  color: var(--accent);
  font-style: normal;
}
.manifesto-text .blue { color: var(--accent-2); font-style: normal; }

/* Brand strip */
.brands {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 0;
  border: 1px solid var(--line);
}
.brand-cell {
  aspect-ratio: 5 / 3;
  display: flex;
  align-items: center;
  justify-content: center;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  margin: -1px;
  padding: 20px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(14px, 1.4vw, 20px);
  letter-spacing: -0.01em;
  color: var(--ink-3);
  transition: color 0.3s, background 0.3s;
  text-align: center;
}
.brand-cell:hover { color: var(--ink); background: rgba(255,255,255,0.5); }
@media (max-width: 900px) { .brands { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 480px) { .brands { grid-template-columns: repeat(2, 1fr); } }

/* Hero specific */
.hero {
  padding: 140px var(--gutter) var(--section-y);
  position: relative;
}
.hero__top {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 32px;
  margin-bottom: 64px;
  flex-wrap: wrap;
}
.hero__display {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--h-display);
  line-height: 0.85;
  letter-spacing: -0.03em;
  margin: 0;
}
.hero__display .accent { color: var(--accent); }
.hero__display .accent-blue { color: var(--accent-2); }
.hero__display .italic { font-style: italic; font-weight: 400; }
.hero__reel {
  position: relative;
  aspect-ratio: 16 / 9;
  margin-top: 48px;
}
.hero__sub {
  max-width: 520px;
  font-size: clamp(16px, 1.2vw, 20px);
  line-height: 1.5;
  color: var(--ink-2);
}
.hero__stats {
  display: flex;
  gap: 48px;
  margin-top: 64px;
  flex-wrap: wrap;
}
.stat {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.stat__num {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(36px, 4vw, 60px);
  line-height: 1;
  letter-spacing: -0.02em;
}
.stat__label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* MUV Hub modules */
.module {
  padding: 40px;
  border: 1px solid var(--dark-line);
  display: flex;
  flex-direction: column;
  gap: 24px;
  min-height: 420px;
  transition: background 0.4s var(--ease);
  position: relative;
  overflow: hidden;
}
.module:hover { background: rgba(255,255,255,0.04); }
.module__icon {
  width: 48px; height: 48px;
  border: 1px solid var(--dark-line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
}
.module__title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(24px, 2.4vw, 36px);
  line-height: 1.05;
  margin-top: auto;
}
.module__features {
  list-style: none;
  padding: 0; margin: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.module__features li {
  font-size: 13px;
  color: var(--dark-ink-2);
  padding-left: 16px;
  position: relative;
}
.module__features li::before {
  content: "—";
  position: absolute;
  left: 0;
  color: var(--accent);
}

/* Team grid */
.team {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
}
@media (max-width: 900px) { .team { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .team { grid-template-columns: 1fr; } }
.team__card {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.team__photo {
  aspect-ratio: 4 / 5;
  margin-bottom: 8px;
}
.team__name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 18px;
  letter-spacing: -0.015em;
}
.team__role {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* Blog post */
.post {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 32px 0;
  border-top: 1px solid var(--line);
  cursor: pointer;
  transition: padding-left 0.4s var(--ease);
}
.post:hover { padding-left: 16px; }
.post__head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 24px;
}
.post__title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(22px, 2vw, 32px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  flex: 1;
  text-wrap: balance;
}
.post:hover .post__title { color: var(--accent); }
.post__date {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--ink-3);
  white-space: nowrap;
}
.post__excerpt {
  color: var(--ink-2);
  max-width: 720px;
}

/* Home Blog preview — versão compacta pra caber em 1 viewport */
.home-blog-preview .section-head { margin-bottom: 24px; }
.home-blog-preview .post {
  gap: 6px;
  padding: 14px 0;
}
.home-blog-preview .post__title { font-size: clamp(17px, 1.5vw, 22px); }
.home-blog-preview .post__excerpt { font-size: 14px; line-height: 1.4; max-width: 880px; }
.home-blog-preview .post .link-arrow { font-size: 12px; margin-top: 2px; }

/* Form */
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.field input, .field textarea, .field select {
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  padding: 12px 0;
  font-family: var(--font-body);
  font-size: 16px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.25s;
  border-radius: 0;
}
.field input:focus, .field textarea:focus, .field select:focus {
  border-color: var(--accent);
}
.field textarea { resize: vertical; min-height: 120px; }

/* Sticky page header */
.page-head {
  padding: clamp(80px, 9vw, 140px) var(--gutter) clamp(48px, 5vw, 80px);
  border-bottom: 1px solid var(--line);
  position: relative;
}
.page-head__top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: clamp(48px, 6vw, 88px);
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line-2);
  gap: 24px;
  flex-wrap: wrap;
}
.page-head__crumb { color: var(--ink-3); margin: 0; }
.page-head__top-right {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  display: inline-flex;
  align-items: center;
  gap: 16px;
}
.page-head__top-right::before {
  content: "";
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px rgba(222, 78, 43, 0.15);
}
.page-head__body {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
  gap: clamp(32px, 5vw, 88px);
  align-items: end;
}
@media (max-width: 768px) {
  .page-head__body { grid-template-columns: 1fr; gap: 32px; align-items: start; }
}
.page-head__title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(48px, 7.2vw, 112px);
  line-height: 0.95;
  letter-spacing: -0.035em;
  margin: 0;
  text-wrap: balance;
}
.page-head__title--compact {
  font-size: clamp(40px, 5.4vw, 84px);
  letter-spacing: -0.025em;
}
.page-head__lead {
  font-family: var(--font-body);
  font-size: 19px;
  line-height: 1.5;
  color: var(--ink-2);
  max-width: 460px;
  margin: 0 0 12px;
  text-wrap: pretty;
}
@media (max-width: 600px) { .page-head__lead { font-size: 17px; } }

/* Selection */
::selection { background: var(--accent); color: #fff; }

/* Itálicos editoriais — Inter italic (Archivo Black não tem itálico nativo) */
.editorial-italic,
.hero-cine__display .italic,
.hero__display .italic,
.manifesto-text em,
.display .italic {
  font-family: var(--font-body);
  font-style: italic;
  font-weight: 500;
  letter-spacing: -0.01em;
}

/* Archivo Black apenas para displays gigantes — hero, page head, footer */
.display,
.hero-cine__display,
.hero__display,
.page-head__title,
.footer__giant,
.manifesto-text {
  font-family: var(--font-display);
  font-weight: 400;
}

/* Inter bold/semibold para títulos médios e cards — deixa o site mais leve */
.h2,
.h3,
.svc__title,
.case__title,
.step__title,
.module__title,
.post__title,
.team__name,
.page-head__title small,
.quote-card__title,
.marquee__item,
.brand-marquee__item {
  font-family: var(--font-body);
  font-weight: 700;
  letter-spacing: -0.015em;
}

/* Marquee items ligeiramente diferentes (gigantes) */
.marquee__item, .brand-marquee__item {
  font-weight: 600;
}

/* Reduce motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  /* Exceção: marquees são puramente horizontais e essenciais ao design — não causam mal-estar */
  .brand-marquee__track,
  .marquee__track {
    animation: brand-marquee 50s linear infinite !important;
  }
  .marquee__track { animation-name: marquee !important; }
}

/* ============================================================
   Home CTA — formulário + manchete
   ============================================================ */
.home-cta { padding: var(--section-y) var(--gutter); }
.home-cta__grid {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: clamp(32px, 4vw, 64px);
  align-items: start;
}
@media (max-width: 900px) {
  .home-cta__grid { grid-template-columns: 1fr; gap: 48px; }
  .home-cta__hero { text-align: left; }
}
.home-cta__form { max-width: 640px; width: 100%; }
.home-cta__hero { padding-top: 16px; }

/* Compactar internamente o formulário (sem mexer no bloco do lado) */
.home-cta__form .quote-card { padding: 22px 24px; }
.home-cta__form .quote-card__title { font-size: clamp(18px, 1.5vw, 22px); margin-bottom: 4px; }
.home-cta__form .quote-card__sub { margin-bottom: 12px; font-size: 12px; }
.home-cta__form .quote-card__row { gap: 10px; margin-bottom: 10px; }
.home-cta__form .field--solid { margin-bottom: 10px; }
.home-cta__form .field--solid label { margin-bottom: 2px; font-size: 11px; }
.home-cta__form .field--solid input,
.home-cta__form .field--solid textarea,
.home-cta__form .field--solid select { padding: 6px 10px; font-size: 13px; }
.home-cta__form .field--solid textarea { min-height: 48px; }
.home-cta__form .budget-grid { gap: 5px; }
.home-cta__form .budget-chip { padding: 5px 10px; font-size: 11px; }
.home-cta__form .quote-submit { margin-top: 4px; padding-top: 10px; padding-bottom: 10px; }
.home-cta__form .quote-card__disclaimer { margin-top: 8px; font-size: 11px; }

/* Dark field variant */
.field--dark label { color: var(--dark-ink-2); }
.field--dark input,
.field--dark textarea,
.field--dark select {
  border-bottom: 1px solid var(--dark-line);
  color: var(--dark-ink);
  font-family: var(--font-body);
  width: 100%;
}
.field--dark input:focus,
.field--dark textarea:focus { border-color: var(--accent); }
.field--dark input::placeholder,
.field--dark textarea::placeholder { color: rgba(230,230,239,0.35); }

/* ============================================================
   Quote Card — formulário rico no Home CTA
   ============================================================ */
.quote-card {
  background: var(--bg);
  color: var(--ink);
  border-radius: 18px;
  padding: 40px;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.6) inset,
    0 30px 80px rgba(0,0,0,0.45),
    0 8px 24px rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.06);
  max-width: 560px;
}
@media (max-width: 600px) { .quote-card { padding: 28px; border-radius: 14px; } }

.quote-card__title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(22px, 1.8vw, 28px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 8px;
}
.quote-card__sub {
  font-size: 13px;
  color: var(--ink-3);
  margin: 0 0 32px;
}
.quote-card__row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}
@media (max-width: 520px) { .quote-card__row { grid-template-columns: 1fr; } }

.quote-card__disclaimer {
  text-align: center;
  font-size: 12px;
  color: var(--ink-3);
  margin: 16px 0 0;
  font-family: var(--font-mono);
}

.quote-submit {
  width: 100%;
  justify-content: center;
  padding: 18px 22px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* Solid field variant — input box, not underline */
.field--solid label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 8px;
  display: block;
}
.field--solid input,
.field--solid textarea,
.field--solid select {
  width: 100%;
  background: rgba(0,0,0,0.04);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 16px;
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s, background 0.2s;
  border-bottom: 1px solid var(--line);
}
.field--solid input:focus,
.field--solid textarea:focus,
.field--solid select:focus {
  border-color: var(--ink);
  background: rgba(0,0,0,0.02);
}
.field--solid input::placeholder,
.field--solid textarea::placeholder { color: var(--ink-4); }
.field--solid textarea { resize: vertical; min-height: 100px; }

.select-wrap { position: relative; }
.select-wrap select {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 40px;
  cursor: pointer;
}
.select-chev {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  color: var(--ink-3);
}

/* Budget pill grid */
.budget-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
@media (max-width: 520px) { .budget-grid { grid-template-columns: 1fr 1fr; } }
.budget-chip {
  appearance: none;
  background: rgba(0,0,0,0.04);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 8px;
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.2s;
}
.budget-chip:hover { background: rgba(0,0,0,0.08); }
.budget-chip--on {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

/* Home CTA contact block */
.home-cta__contact {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-top: 56px;
  padding-top: 32px;
  border-top: 1px solid var(--dark-line);
  max-width: 480px;
}
.home-cta__contact-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
  color: var(--dark-ink);
  font-size: 14px;
}
.home-cta__contact-item .mono {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
a.home-cta__contact-item:hover { color: var(--accent); }
.home-cta__contact-item:last-child { grid-column: 1 / -1; }

/* ============================================================
   Página Serviços — alinhamento editorial
   ============================================================ */
.svc-stack { display: flex; flex-direction: column; }
.svc-row {
  display: grid;
  grid-template-columns: minmax(280px, 1fr) minmax(0, 1.8fr);
  gap: clamp(32px, 5vw, 80px);
  align-items: start;
  padding: clamp(48px, 6vw, 96px) 0;
  border-top: 1px solid var(--line);
}
.svc-row__main .cine {
  max-width: 420px !important;
  width: 100% !important;
}
.svc-row:first-child { border-top: 0; padding-top: clamp(24px, 3vw, 48px); }

.svc-row__sidebar {
  position: sticky;
  top: 120px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 16px;
}
.svc-row__num { color: var(--accent); margin: 0; }
.svc-row__pill { margin: 0; }
.svc-row__title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(28px, 3.6vw, 56px);
  line-height: 1.0;
  letter-spacing: -0.025em;
  margin: 12px 0 0;
  text-wrap: balance;
}

.svc-row__main { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.svc-row__desc { color: var(--ink-2); margin: 32px 0 0; max-width: 60ch; }
.svc-row__scope-label { margin: 40px 0 0; }
.svc-row__list {
  list-style: none;
  padding: 0;
  margin: 16px 0 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border-top: 1px solid var(--line-2);
}
.svc-row__list li {
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line-2);
  color: var(--ink-2);
  display: flex;
  align-items: center;
}
.svc-row__list li:nth-child(odd) { padding-right: 16px; border-right: 1px solid var(--line-2); }
.svc-row__list li:nth-child(even) { padding-left: 16px; }
.svc-row__plus {
  color: var(--accent);
  margin-right: 12px;
  font-family: var(--font-mono);
  flex-shrink: 0;
}

@media (max-width: 900px) {
  .svc-row { grid-template-columns: 1fr; gap: 32px; }
  .svc-row__sidebar { position: static; }
  .svc-row__list { grid-template-columns: 1fr; }
  .svc-row__list li:nth-child(odd) { padding-right: 0; border-right: 0; }
  .svc-row__list li:nth-child(even) { padding-left: 0; }
}
.brand-marquee {
  display: flex;
  overflow: hidden;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 32px 0;
  user-select: none;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
}
.brand-marquee--dark { border-color: var(--dark-line); }
.brand-marquee__track {
  display: flex;
  align-items: center;
  gap: 56px;
  flex-shrink: 0;
  animation: brand-marquee 50s linear infinite;
  padding-right: 56px;
}
.brand-marquee__item {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(22px, 2.4vw, 40px);
  line-height: 1;
  letter-spacing: -0.01em;
  color: var(--ink-3);
  white-space: nowrap;
  transition: color 0.3s;
}
.brand-marquee__item:hover { color: var(--ink); }
.brand-marquee--dark .brand-marquee__item { color: var(--dark-ink-2); }
.brand-marquee--dark .brand-marquee__item:hover { color: var(--dark-ink); }
.brand-marquee__sep {
  color: var(--accent);
  font-size: 0.5em;
  opacity: 0.5;
}
@keyframes brand-marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-33.333%); }
}

/* ============================================================
   Hero Cinemático — showreel BG + h1 sobreposto + fade no scroll
   ============================================================ */
.hero-cine {
  position: relative;
  min-height: 100vh;
  height: 100vh;
  padding: 100px var(--gutter) 64px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  color: var(--dark-ink);
  background: var(--dark-bg);
}
.hero-cine__media {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.hero-cine__media .cine {
  width: 100% !important;
  height: 100% !important;
  aspect-ratio: auto !important;
  border: 0;
  background:
    repeating-linear-gradient(135deg, rgba(230,230,239,0.025) 0 1px, transparent 1px 14px),
    radial-gradient(ellipse at 30% 40%, rgba(222,78,43,0.08), transparent 60%),
    linear-gradient(180deg, #232328, #1B1B1F);
}

/* ============================================================
   Showreel BG — placeholder cinematográfico animado
   ============================================================ */
.showreel {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #0d0d12;
}
.showreel__scene {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 1.4s var(--ease-out), transform 5s linear;
  transform: scale(1.05);
  will-change: opacity, transform;
}
.showreel__scene.is-on {
  opacity: 1;
  transform: scale(1.0);
  animation: ken-burns 5s ease-out forwards;
}
@keyframes ken-burns {
  from { transform: scale(1.0) translate3d(0,0,0); }
  to   { transform: scale(1.08) translate3d(-1.5%, -1%, 0); }
}

/* Color bars / SMPTE feel at right edge */
.showreel__bars {
  position: absolute;
  inset: 0 0 0 auto;
  width: 4px;
  background: linear-gradient(180deg,
    #fff 0%, #fff 14%,
    #d4a04a 14%, #d4a04a 28%,
    #1B57AD 28%, #1B57AD 42%,
    #DE4E2B 42%, #DE4E2B 56%,
    #2D2D2D 56%, #2D2D2D 70%,
    #0d0d12 70%, #0d0d12 100%);
  opacity: 0.4;
}

/* Film grain — animated noise */
.showreel__grain {
  position: absolute;
  inset: -10%;
  background-image:
    radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1.5px),
    radial-gradient(rgba(0,0,0,0.15) 1px, transparent 1.5px);
  background-size: 3px 3px, 5px 5px;
  background-position: 0 0, 1px 1px;
  opacity: 0.5;
  mix-blend-mode: overlay;
  animation: grain 0.25s steps(4) infinite;
  pointer-events: none;
}
@keyframes grain {
  0% { transform: translate(0,0); }
  25% { transform: translate(-2%, 1%); }
  50% { transform: translate(1%, -2%); }
  75% { transform: translate(-1%, -1%); }
  100% { transform: translate(0, 0); }
}

/* Vignette */
.showreel__vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
  pointer-events: none;
}

/* Scanlines subtle */
.showreel__scanlines {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.06) 0 1px, transparent 1px 3px);
  pointer-events: none;
  opacity: 0.5;
}

/* HUD corners */
.showreel__hud {
  position: absolute;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 16px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  color: rgba(230,230,239,0.65);
  text-transform: uppercase;
  pointer-events: none;
}
.showreel__hud--tl { top: 24px; left: 24px; }
.showreel__hud--tr { top: 24px; right: 32px; }
.showreel__hud--bl { bottom: 56px; left: 24px; }
.showreel__hud--br { bottom: 56px; right: 32px; }
@media (max-width: 600px) {
  .showreel__hud { font-size: 9px; gap: 8px; }
  .showreel__hud--tl { top: 12px; left: 12px; }
  .showreel__hud--tr { top: 12px; right: 16px; }
  .showreel__hud--bl { bottom: 36px; left: 12px; }
  .showreel__hud--br { bottom: 36px; right: 16px; }
}

.showreel__rec {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--accent);
  font-weight: 600;
}
.showreel__rec-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
  animation: rec-pulse 1.6s ease-in-out infinite;
}

.showreel__hud-text {
  background: rgba(0,0,0,0.45);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  padding: 4px 10px;
  border: 1px solid rgba(230,230,239,0.12);
  border-radius: 4px;
  font-variant-numeric: tabular-nums;
}

/* Timeline at bottom */
.showreel__timeline {
  position: absolute;
  left: 24px;
  right: 24px;
  bottom: 28px;
  height: 2px;
  background: rgba(230,230,239,0.15);
  z-index: 3;
}
.showreel__timeline-fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--accent);
  transition: width 1.2s var(--ease-out);
}
.showreel__timeline-mark {
  position: absolute;
  top: -4px;
  width: 1px;
  height: 10px;
  background: rgba(230,230,239,0.4);
}
@media (max-width: 600px) {
  .showreel__timeline { left: 12px; right: 16px; bottom: 14px; }
}
.hero-cine__scrim {
  position: absolute;
  inset: 0;
  z-index: 1;
  background:
    linear-gradient(180deg, rgba(27,27,31,0.15) 0%, rgba(27,27,31,0.05) 35%, rgba(27,27,31,0.55) 100%);
  pointer-events: none;
}
.hero-cine__content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  flex: 1;
  justify-content: space-between;
  will-change: opacity, transform;
}
.hero-cine__top {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 32px;
  flex-wrap: wrap;
}
.hero-cine__mid {
  margin: auto 0;
}
.hero-cine__display {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(64px, 11vw, 184px);
  line-height: 0.88;
  letter-spacing: -0.03em;
  margin: 0;
  color: var(--dark-ink);
  text-wrap: balance;
}
.hero-cine__display .accent { color: var(--accent); }
.hero-cine__display .italic { font-style: italic; font-weight: 400; }
.hero-cine__bottom {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 48px;
  align-items: end;
}
@media (max-width: 900px) { .hero-cine__bottom { grid-template-columns: 1fr; gap: 24px; } }
.hero-cine__sub {
  max-width: 480px;
  color: var(--dark-ink-2);
  font-size: clamp(15px, 1.15vw, 18px);
  line-height: 1.55;
}
.hero-cine__actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
@media (max-width: 900px) { .hero-cine__actions { justify-content: flex-start; } }

.hero-cine__corners {
  position: absolute;
  inset: 80px var(--gutter) 24px;
  z-index: 2;
  pointer-events: none;
  display: flex;
  justify-content: space-between;
  align-items: end;
}
.hero-cine__corners .mono {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--dark-ink-2);
}
.hero-cine__rec {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.hero-cine__rec::before {
  content: "";
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  animation: rec-pulse 1.6s ease-in-out infinite;
}

/* ============================================================
   HERO INTRO — Letterbox + Title Card cinematográfico
   ============================================================ */

/* Black bars (letterbox) — começam cobrindo 50vh cada, retraem pra 0 */
.hero-cine__bar {
  position: absolute;
  left: 0;
  right: 0;
  z-index: 6;
  background: #000;
  height: 50vh;
  transition: transform 1.2s cubic-bezier(0.85, 0, 0.15, 1);
  pointer-events: none;
}
.hero-cine__bar--top { top: 0; transform: translateY(0); }
.hero-cine__bar--bot { bottom: 0; transform: translateY(0); }

/* Quando entra "open" ou depois, as barras saem */
.intro-open .hero-cine__bar--top,
.intro-title .hero-cine__bar--top,
.intro-done .hero-cine__bar--top  { transform: translateY(-100%); }
.intro-open .hero-cine__bar--bot,
.intro-title .hero-cine__bar--bot,
.intro-done .hero-cine__bar--bot  { transform: translateY(100%); }

/* Title card no centro durante o boot (entre as barras) */
.hero-cine__bootcard {
  position: absolute;
  inset: 0;
  z-index: 7;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: var(--dark-ink);
  pointer-events: none;
  text-align: center;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.5s ease-out, transform 0.6s ease-out;
}
.intro-boot .hero-cine__bootcard { opacity: 1; transform: translateY(0); transition-delay: 0.15s; }
.intro-open .hero-cine__bootcard { opacity: 0; transform: translateY(-8px); transition: opacity 0.35s ease-in; }
.intro-title .hero-cine__bootcard,
.intro-done .hero-cine__bootcard { opacity: 0; visibility: hidden; }

.hero-cine__bootcard .mono {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--dark-ink);
  margin: 0;
}
.hero-cine__bootcard .mono:first-child {
  font-family: var(--font-display);
  font-size: clamp(28px, 4vw, 56px);
  letter-spacing: -0.02em;
  text-transform: none;
  position: relative;
  padding-bottom: 16px;
}
.hero-cine__bootcard .mono:first-child::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 1px;
  background: var(--accent);
  animation: bootcard-line 0.8s 0.3s ease-out forwards;
}
@keyframes bootcard-line {
  to { width: 60px; }
}
.hero-cine__bootcard-meta {
  opacity: 0;
  animation: bootcard-fade 0.6s 0.5s ease-out forwards;
}
@keyframes bootcard-fade {
  to { opacity: 1; }
}

/* HUD do showreel — escondido durante o boot, aparece depois */
.intro-boot .showreel__hud,
.intro-boot .showreel__timeline { opacity: 0; }
.showreel__hud, .showreel__timeline {
  transition: opacity 0.6s ease-out;
}

/* Conteúdo do hero — só aparece depois das barras saírem */
.hero-cine__content {
  opacity: 0;
  transition: opacity 0.7s ease-out;
}
.intro-title .hero-cine__content,
.intro-done .hero-cine__content { opacity: 1; }

/* Headline reveal — cada palavra sobe por trás de uma máscara */
.reveal-word {
  display: inline-block;
  overflow: hidden;
  vertical-align: top;
  line-height: 0.88;
}
.reveal-word > span {
  display: inline-block;
  transform: translateY(110%);
  transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.intro-title .reveal-word > span,
.intro-done .reveal-word > span {
  transform: translateY(0);
}
.intro-title .hero-cine__display .reveal-word:nth-of-type(1) > span { transition-delay: 0.05s; }
.intro-title .hero-cine__display .reveal-word:nth-of-type(2) > span { transition-delay: 0.18s; }
.intro-title .hero-cine__display .reveal-word:nth-of-type(3) > span { transition-delay: 0.30s; }

/* Hero top/bottom: fade-in atrasado */
.hero-cine__top, .hero-cine__bottom {
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.7s 0.55s ease-out, transform 0.7s 0.55s ease-out;
}
.intro-title .hero-cine__top, .intro-title .hero-cine__bottom,
.intro-done  .hero-cine__top, .intro-done  .hero-cine__bottom {
  opacity: 1; transform: translateY(0);
}

/* Reduce motion: skip animation */
@media (prefers-reduced-motion: reduce) {
  .hero-cine__bar { display: none; }
  .hero-cine__bootcard { display: none; }
  .hero-cine__content { opacity: 1; }
  .reveal-word > span { transform: translateY(0); transition: none; }
  .hero-cine__top, .hero-cine__bottom { opacity: 1; transform: none; transition: none; }
}
@keyframes rec-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Stats — agora seção separada após o hero */
.hero-stats {
  padding: 64px var(--gutter);
  border-bottom: 1px solid var(--line);
}
.hero-stats__inner {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 32px;
}
@media (max-width: 900px) { .hero-stats__inner { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .hero-stats__inner { grid-template-columns: 1fr; } }

/* Step row clicável */
.step--link { cursor: pointer; }
.step--link .step__title { transition: color 0.3s var(--ease); }
.step--link:hover .step__title { color: var(--accent); }
.step--link:hover .step__num { color: var(--ink); }
.step__arrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--ink-3);
  opacity: 0;
  transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.step--link:hover .step__arrow {
  opacity: 1;
  color: var(--accent);
}

/* ============================================================
   HERO STATS — refinamento editorial
   ============================================================ */
.hero-stats {
  padding: clamp(48px, 6vw, 88px) var(--gutter);
  border-bottom: 1px solid var(--line);
}
.hero-stats__inner {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-top: 1px solid var(--line);
  padding-top: clamp(32px, 4vw, 56px);
}
.hero-stats__inner .stat {
  padding: 0 24px;
  border-left: 1px solid var(--line-2);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-stats__inner .stat:first-child { border-left: 0; padding-left: 0; }
.hero-stats__inner .stat__num {
  font-family: var(--font-display);
  font-weight: 400;

      </div>
    </div>);

}

// ───── Page Head ─────────────────────────────────────────────────────────────
function PageHead({ crumb, title, lead, accent, meta, compact }) {
  // Suporta quebra de linha via "\n" no título, mantendo a destaque do accent.
  const renderLineWithAccent = (line, key) => {
    if (!accent || !line.includes(accent)) return <span key={key}>{line}</span>;
    const [before, after] = line.split(accent);
    return (
      <span key={key}>
        {before}<span style={{ color: "var(--accent)" }}>{accent}</span>{after}
      </span>);
  };

  const lines = title.split("\n");
  const titleNode = lines.length > 1 ?
    lines.map((line, i) => (
      <React.Fragment key={i}>
        {renderLineWithAccent(line, i)}
        {i < lines.length - 1 && <br />}
      </React.Fragment>
    )) :
    renderLineWithAccent(title, 0);

  return (
    <header className="page-head">
      <div className="page-head__top">
        <p className="eyebrow eyebrow-dot page-head__crumb">{crumb}</p>
        <span className="page-head__top-right">{meta || "Ed. 01 · 2026"}</span>
      </div>
      <div className="page-head__body">
        <h1 className={`page-head__title ${compact ? "page-head__title--compact" : ""}`}>{titleNode}</h1>
        <p className="page-head__lead">{lead}</p>
      </div>
    </header>);

}

// ───── Reveal on scroll ──────────────────────────────────────────────────────
function Reveal({ children, delay = 0, as: Tag = "div", ...rest }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {setShown(true);io.disconnect();}
    }, { threshold: 0.15 });
    io.observe(ref.current);
    return () => io.disconnect();
  }, []);
  return (
    <Tag ref={ref} className={`reveal ${shown ? "in" : ""}`} style={{ transitionDelay: `${delay}ms` }} {...rest}>
      {children}
    </Tag>);

}

function ShowreelBG() {
  const [scene, setScene] = useState(0);
  const [tc, setTc] = useState({ m: 0, s: 0, f: 0 });
  useEffect(() => {
    const id = setInterval(() => setScene((s) => (s + 1) % SHOWREEL_SCENES.length), 4200);
    return () => clearInterval(id);
  }, []);
  useEffect(() => {
    const id = setInterval(() => {
      setTc((t) => {
        let f = t.f + 1;
        let s = t.s,m = t.m;
        if (f >= 24) {f = 0;s += 1;}
        if (s >= 60) {s = 0;m += 1;}
        if (m >= 99) m = 0;
        return { m, s, f };
      });
    }, 41); // ~24fps
    return () => clearInterval(id);
  }, []);
  const pad = (n, w = 2) => String(n).padStart(w, "0");

  return (
    <div className="showreel">
      {SHOWREEL_SCENES.map((sc, i) =>
      <div key={i} className={`showreel__scene ${i === scene ? "is-on" : ""}`} style={{ background: sc.grad }} />
      )}
      <div className="showreel__bars" />
      <div className="showreel__grain" />
      <div className="showreel__vignette" />
      <div className="showreel__scanlines" />

      {/* HUD */}
      <div className="showreel__hud showreel__hud--tl">
        <span className="showreel__rec"><span className="showreel__rec-dot" /> REC</span>
        <span className="showreel__hud-text">SHOWREEL · MUV · 2026</span>
      </div>
      <div className="showreel__hud showreel__hud--tr">
        <span className="showreel__hud-text">TC {pad(tc.m)}:{pad(tc.s)}:{pad(tc.f)}</span>

// ───── StatCounter ─ count-up animado quando entra no viewport ──────────────
function StatCounter({ target, prefix = "", suffix = "", pad = 0, label, accent = false }) {
  const ref = useRef(null);
  const [value, setValue] = useState(1);
  const [started, setStarted] = useState(false);

  useEffect(() => {
    if (!ref.current || started) return;
    const io = new IntersectionObserver(
      (entries) => {
        if (entries[0].isIntersecting && !started) {
          setStarted(true);
          io.disconnect();
        }
      },
      { threshold: 0.4 }
    );
    io.observe(ref.current);
    return () => io.disconnect();
  }, [started]);

  useEffect(() => {
    if (!started) return;
    // Anima 1 → target em ~1.6s, easing easeOutCubic pra desacelerar no fim
    const duration = Math.min(1600, 600 + target * 8);
    const start = performance.now();
    let raf;
    const tick = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const v = Math.max(1, Math.round(1 + (target - 1) * eased));
      setValue(v);
      if (t < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [started, target]);

  const displayValue = pad > 0 ? String(value).padStart(pad, "0") : String(value);

  return (
    <div className="stat" ref={ref}>
      <span className="stat__num" style={accent ? { color: "var(--accent)" } : undefined}>
        {prefix}{displayValue}{suffix}
      </span>
      <span className="stat__label">{label}</span>
    </div>);
}

    const onScroll = () => {

      scrollProg = Math.max(0, Math.min(1, window.scrollY / (h * 0.55)));
      apply();
    };

    // Auto-fade only AFTER intro finishes (4.5s total: 3.6s intro + 0.9s grace)
    const start = performance.now() + 5500;
    const tick = (now) => {
      const elapsed = now - start;
      if (elapsed >= 0) autoFade = Math.min(1, elapsed / 2500);else
      autoFade = 0;
      apply();
      if (autoFade < 1) rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);

    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => {
      window.removeEventListener("scroll", onScroll);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);

  <script type="text/babel" data-file="app.jsx">
// app.jsx — Grupo MUV site (production)
// Tweaks baked in: Archivo Black display · Inter body · orange accent · regular density.

const { useState, useEffect } = React;

const DISPLAY_FONT = `"Archivo Black", "Anton", system-ui, sans-serif`;
const BODY_FONT    = `"Inter", "Helvetica Neue", system-ui, sans-serif`;

const DARK_NAV_PAGES = new Set(["hub"]);

function App() {
  const [current, _setCurrent] = useState(() => {
    const hash = (window.location.hash || "").replace("#", "");
    return hash && NAV_ITEMS.find((n) => n.id === hash) ? hash : "home";
  });
  const [scrolledPastHero, setScrolledPastHero] = useState(false);

  const setCurrent = (id) => {
    _setCurrent(id);
    window.location.hash = id;
    window.scrollTo({ top: 0, behavior: "instant" });
  };

  // Bake design tokens into :root once
  useEffect(() => {
    const root = document.documentElement;
    root.setAttribute("data-density", "regular");
    root.style.setProperty("--font-display", DISPLAY_FONT);
    root.style.setProperty("--font-body",    BODY_FONT);
    root.style.setProperty("--accent",       "#DE4E2B");
    root.style.setProperty("--accent-2",     "#1B57AD");
  }, []);

  // Detect scroll past hero on Home for dynamic nav theming
  useEffect(() => {
    if (current !== "home") { setScrolledPastHero(true); return; }
    const onScroll = () => {
      setScrolledPastHero(window.scrollY > window.innerHeight * 0.7);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, [current]);

  // Hash listener for back/forward navigation
  useEffect(() => {
    const onHash = () => {
      const h = (window.location.hash || "").replace("#", "");
      if (h && h !== current) _setCurrent(h);
    };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, [current]);

  const isDark = DARK_NAV_PAGES.has(current) || (current === "home" && !scrolledPastHero);

  let Page = Home;
  if      (current === "servicos")  Page = Servicos;
  else if (current === "processo")  Page = Processo;
  else if (current === "trabalhos") Page = Trabalhos;
  else if (current === "sobre")     Page = Sobre;
  else if (current === "hub")       Page = MuvHub;
  else if (current === "blog")      Page = Blog;
  else if (current === "faq")       Page = Faq;
  else if (current === "contato")   Page = Contato;

  return (
    <React.Fragment>
      <Nav current={current} setCurrent={setCurrent} isDark={isDark} />
      <Page setCurrent={setCurrent} density="regular" />
      <Footer setCurrent={setCurrent} />
    </React.Fragment>
  );
}

// Defer mount para depois de todos os scripts text/babel terem sido compilados+executados.
// Resolve race condition transitória entre Babel standalone e a ordem de execução das tags JSX.
setTimeout(() => {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}, 0);

  </script>

  <!-- Cookie banner + WhatsApp scroll logic -->
  <script>
    (function(){
      // Cookie banner
      try {
        var consent = localStorage.getItem('muv-cookie-consent');
        if (!consent) {
          var el = document.getElementById('muv-cookie');
          if (el) {
            // Mostra só depois do hero, pra não competir com a entrada cinemática
            setTimeout(function(){ el.hidden = false; }, 4200);
          }
        }
        document.getElementById('muv-cookie-accept').addEventListener('click', function(){
          localStorage.setItem('muv-cookie-consent', 'accepted');
          localStorage.setItem('muv-cookie-consent-at', new Date().toISOString());
          document.getElementById('muv-cookie').hidden = true;
        });
        document.getElementById('muv-cookie-reject').addEventListener('click', function(){
          localStorage.setItem('muv-cookie-consent', 'rejected');
          localStorage.setItem('muv-cookie-consent-at', new Date().toISOString());
          document.getElementById('muv-cookie').hidden = true;
        });
      } catch(_) {}

      // WhatsApp aparece após scroll de 200px
      var wa = document.getElementById('muv-whatsapp');
      function toggleWA(){
        if (!wa) return;
        if (window.scrollY > 200) wa.hidden = false;
        else wa.hidden = true;
      }
      window.addEventListener('scroll', toggleWA, { passive: true });
      toggleWA();
    })();
  </script>
